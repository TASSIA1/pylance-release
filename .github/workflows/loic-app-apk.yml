name: Loïc App — build APK Android

on:
  workflow_dispatch:
  push:
    paths:
      - 'loic-app/**'
      - '.github/workflows/loic-app-apk.yml'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: loic-app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Générer les icônes PNG à partir des logos SVG
        run: |
          sudo apt-get update && sudo apt-get install -y librsvg2-bin
          rsvg-convert -w 192 -h 192 www/icons/logo.svg -o www/icons/icon-192.png
          rsvg-convert -w 512 -h 512 www/icons/logo.svg -o www/icons/icon-512.png
          rsvg-convert -w 512 -h 512 www/icons/maskable.svg -o www/icons/icon-maskable-512.png
      - name: Accepter les licences du SDK Android préinstallé
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: LoicApp-apk
          path: loic-app/android/app/build/outputs/apk/debug/app-debug.apk
      - name: Renommer l'APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk LoicApp.apk
      - name: Publier l'APK (lien de téléchargement direct)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: loic-app
          name: Loïc App — application Android
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            Télécharger **LoicApp.apk** ci-dessous puis l'ouvrir sur le téléphone Android pour l'installer.
            Lien direct : https://github.com/${{ github.repository }}/releases/download/loic-app/LoicApp.apk
          files: loic-app/LoicApp.apk
          overwrite_files: true
